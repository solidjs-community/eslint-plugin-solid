[package]
name = "solid-linter"
version = "0.1.0"
edition = "2021"
description = "SolidJS linting rules using oxc"
license = "MIT"
repository = "https://github.com/solidjs-community/eslint-plugin-solid"

[[bin]]
name = "solid-lint"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
colored = "2.1"
oxc_allocator = "0.65"
oxc_ast = "0.65"
oxc_ast_visit = "0.65"
oxc_diagnostics = "0.65"
oxc_parser = "0.65"
oxc_semantic = "0.65"
oxc_span = "0.65"
oxc_syntax = "0.65"
regex = "1"
rustc-hash = "2.0"
miette = { version = "7", features = ["fancy"] }

[dev-dependencies]
insta = "1.39"

[features]
default = []
